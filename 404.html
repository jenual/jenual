<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>페이지 이동 중 — JENUAL</title>
    <script>
      (function () {
        var base = "/jenual/";
        var location = window.location;
        var pathname = location.pathname;
        var relativePath = pathname;

        if (base !== "/" && pathname.indexOf(base) === 0) {
          relativePath = pathname.slice(base.length - 1);
        }

        var target = location.origin + base + "?p=" + encodeURIComponent(relativePath + location.search) + location.hash;
        location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
