<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>페이지 이동 중 — JENUAL</title>
    <script>
      (function () {
        var location = window.location;
        var base = "/jenual/";
        var baseNoSlash = base.replace(/\/$/, "");
        var pathname = location.pathname;
        var route = pathname.indexOf(baseNoSlash) === 0
          ? pathname.slice(baseNoSlash.length) || "/"
          : pathname;
        location.replace(
          location.origin + base + "?p=" + encodeURIComponent(route) +
          (location.search ? "&q=" + encodeURIComponent(location.search.slice(1)) : "") +
          location.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
