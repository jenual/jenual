<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>페이지 이동 중 — JENUAL</title>
    <script>
      (function () {
        var location = window.location;
        var path = location.pathname + location.search;
        var queryIndex = path.indexOf("?");
        var pathname = queryIndex === -1 ? path : path.slice(0, queryIndex);
        var query = queryIndex === -1 ? "" : path.slice(queryIndex + 1);
        location.replace(
          location.origin + "/?p=" + encodeURIComponent(pathname) +
          (query ? "&q=" + encodeURIComponent(query) : "") + location.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
